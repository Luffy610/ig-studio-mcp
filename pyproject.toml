[project]
name = "ig-studio-mcp"
version = "0.1.0"
description = "Local MCP server that lets Claude manage an Instagram professional account through Meta's official Instagram API with Unified Login."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dhruv Kotwani" }]
keywords = ["mcp", "model-context-protocol", "instagram", "instagram-graph-api", "meta", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/Luffy610/ig-studio-mcp"
Documentation = "https://github.com/Luffy610/ig-studio-mcp#readme"
Issues = "https://github.com/Luffy610/ig-studio-mcp/issues"
Changelog = "https://github.com/Luffy610/ig-studio-mcp/blob/master/CHANGELOG.md"

[project.scripts]
ig-studio-mcp = "ig_studio_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ig_studio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter handles code; long lines left are message strings

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.14",
]
